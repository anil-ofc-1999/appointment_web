<header class="topbar">
  <a routerLink="/" class="brand">
    <img src="favicon.svg" alt="" width="32" height="32" class="brand-logo" />
    <span>Doctor Appointments</span>
  </a>

  <nav class="nav" aria-label="Account">
    @if (auth.user(); as user) {
      <a routerLink="/doctors" routerLinkActive="active">Find a doctor</a>
      @if (user.role === 'PATIENT') {
        <a routerLink="/appointments" routerLinkActive="active">My appointments</a>
      }
      @if (user.role === 'DOCTOR') {
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      }
      @if (user.role === 'ADMIN') {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
      <span class="user" data-testid="current-user">{{ user.name }}</span>
      <a routerLink="/account/password" routerLinkActive="active">Change password</a>
      <button type="button" class="nav-button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Log in</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>

<main class="content">
  <router-outlet />
</main>
