<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-label="Booking a doctor's appointment on a calendar">
  <title>Booking a doctor's appointment</title>
  <!-- soft blobs -->
  <circle cx="270" cy="70" r="62" fill="#cfe2f7"/>
  <circle cx="70" cy="220" r="48" fill="#d5f2e9"/>
  <!-- calendar card -->
  <g transform="translate(70 46)">
    <rect width="200" height="176" rx="18" fill="#ffffff" stroke="#bcd6f2" stroke-width="2"/>
    <path d="M0 18a18 18 0 0 1 18-18h164a18 18 0 0 1 18 18v26H0z" fill="#1d5fa8"/>
    <rect x="42" y="-10" width="10" height="26" rx="5" fill="#0f3f73"/>
    <rect x="148" y="-10" width="10" height="26" rx="5" fill="#0f3f73"/>
    <!-- slots grid -->
    <g fill="#e8f1fb">
      <rect x="20" y="62" width="44" height="26" rx="6"/>
      <rect x="78" y="62" width="44" height="26" rx="6"/>
      <rect x="136" y="62" width="44" height="26" rx="6"/>
      <rect x="20" y="100" width="44" height="26" rx="6"/>
      <rect x="136" y="100" width="44" height="26" rx="6"/>
      <rect x="20" y="138" width="44" height="26" rx="6"/>
      <rect x="78" y="138" width="44" height="26" rx="6"/>
      <rect x="136" y="138" width="44" height="26" rx="6"/>
    </g>
    <!-- the booked slot -->
    <rect x="78" y="100" width="44" height="26" rx="6" fill="#0fa37f"/>
    <path d="M90 113l7 7 13-13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- stethoscope -->
  <g fill="none" stroke="#1d5fa8" stroke-width="6" stroke-linecap="round">
    <path d="M300 150v38a34 34 0 0 1-68 0v-6"/>
    <path d="M232 182v-22"/>
  </g>
  <circle cx="300" cy="146" r="12" fill="#ffffff" stroke="#1d5fa8" stroke-width="6"/>
  <circle cx="232" cy="154" r="7" fill="#1d5fa8"/>
  <!-- medical plus -->
  <path d="M40 60h10v10h10v10H50v10H40V80H30V70h10z" fill="#0fa37f" fill-opacity="0.85"/>
</svg>
